name: Update language card

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-language-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate language card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_languages.py
      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain -- assets/languages.svg)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/languages.svg
            git commit -m "Refresh language card"
            git push
          fi
